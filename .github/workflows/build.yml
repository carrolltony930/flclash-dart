name: build-app-framework

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: "APP_ENV value"
        required: false
        default: "stable"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout FlClash v0.9.3
        uses: actions/checkout@v4
        with:
          repository: chen08209/FlClash
          ref: v0.9.3
          submodules: recursive
          path: app

      - name: Setup Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Validate source tree
        working-directory: app
        run: |
          git rev-parse HEAD
          git log -1 --format='%ci %s'
          echo "--- dashboard.dart refs ---"
          grep -n "widget_registry\|core_status_button\|widgets/widgets" lib/views/dashboard/dashboard.dart || echo "NO MATCH"
          echo "--- widgets dir ---"
          ls lib/views/dashboard/widgets | tr '\n' ' '; echo
          echo "--- ip_quality exists? ---"
          ls -la lib/common/ip_quality.dart 2>/dev/null || echo MISSING

      - name: Verify engine hash
        run: |
          flutter --version
          echo "ENGINE=$(cat $FLUTTER_ROOT/bin/internal/engine.version)"
          echo "expect=89c39edfdfae2949f6806e4a315c0c08522238b7"

      - name: Disable native asset hooks
        working-directory: app
        run: |
          python3 - <<'EOF'
          import re
          p = 'pubspec.yaml'
          s = open(p).read()
          s2 = re.sub(r'(build_assets:\s*)true', r'\1false', s)
          open(p, 'w').write(s2)
          print('changed' if s2 != s else 'UNCHANGED')
          EOF
          sed -n '8,20p' pubspec.yaml
          echo "--- lib/main.dart head ---"
          head -8 lib/main.dart

      - name: Add Rust iOS target
        run: |
          rustup target add aarch64-apple-ios || echo "rustup unavailable"

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Create iOS platform scaffold
        working-directory: app
        run: |
          flutter create --platforms=ios --org cc.flclash --project-name fl_clash --no-pub . 2>&1 | tail -15
          ls ios | head -20
          test -f ios/Runner.xcodeproj/project.pbxproj && echo "pbxproj OK"

      - name: Build App.framework
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios-framework --release --no-codesign \
            --dart-define=APP_ENV=${{ inputs.app_env }} \
            --output=build/fw 2>&1 | tail -60

      - name: Inspect output
        working-directory: app
        run: |
          find build/fw -maxdepth 3 -type d | head -40
          for f in $(find build/fw -name App -type f); do
            echo "$f $(stat -f%z $f)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-framework
          path: app/build/fw/**
          if-no-files-found: error
